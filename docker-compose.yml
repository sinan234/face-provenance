# Local development stack:
#   anvil — Ethereum-compatible local chain (no installation needed)
#   cli   — the provenance pipeline CLI
#   web   — the FastAPI dashboard (http://localhost:8000)
#
# Start everything:    docker compose up -d
# Deploy contract:     docker compose run --rm cli python scripts/deploy_contract.py --save-env
# Run the CLI:         docker compose run --rm cli process /app/data/input.jpg --mode real --chain anvil
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  cli:
    build: .
    depends_on:
      anvil:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BLOCKCHAIN_RPC_URL: http://anvil:8545
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ./data:/app/data

  web:
    build: .
    depends_on:
      anvil:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn", "src.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BLOCKCHAIN_RPC_URL: http://anvil:8545
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ./data:/app/data
